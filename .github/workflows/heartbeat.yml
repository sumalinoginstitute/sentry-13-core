name: SENTRY-13 Heartbeat Robot

on:
  schedule:
    # This CRON expression runs the robot every single day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # This allows you to manually click a button to test it anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Up Project Endpoint
        run: |
          curl -i -X GET "https://dkhruuycsvmjhtvjpnrl.supabase.co/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
